<head>
<meta charset="UTF-8">

<title>Checkout – Al-Noor Modest Wear</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;

<body>

<header>
    <h1>Al-Noor Modest Wear</h1>
</header>

<div class="container">

    <!-- CUSTOMER DETAILS -->
    <div class="card">

        <h2>Customer Details</h2>

        <label for="customerName">Full Name</label>
        <input
            type="text"
            id="customerName"
            placeholder="Enter your full name"
            required
        >

        <label for="phone">M-Pesa Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="07XXXXXXXX"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="location">Delivery Location</label>
        <input
            type="text"
            id="location"
            placeholder="e.g. Eldoret CBD"
            required
        >

        <label for="address">Delivery Address</label>
        <textarea
            id="address"
            placeholder="Enter your delivery address"
            required
        ></textarea>

    </div>


    <!-- ORDER SUMMARY -->
    <div class="card">

        <h2>Order Summary</h2>

        <div id="orderItems"></div>

        <div class="total">
            Total: KES <span id="orderTotal">0</span>
        </div>

    </div>


    <!-- PAYMENT -->
    <div class="card">

        <h2>Payment</h2>

        <div class="payment-box">

            <label for="paymentAmount">
                Amount to Pay with M-Pesa
            </label>

            <input
                type="number"
                id="paymentAmount"
                min="1"
                step="1"
                required
                placeholder="Enter amount"
            >

            <div class="balance">
                Remaining Balance:
                KES <span id="remainingBalance">0</span>
            </div>

        </div>

        <button id="payButton">
            Pay with M-Pesa
        </button>

        <div id="message"></div>

    </div>

</div>


<!-- CART SCRIPT -->
<script src="cart.js"></script>


<script>

const SUPABASE_URL =
    "https://tcoobzomueszhvmtxeta.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1kqxZHt_moeKQigTvBb1Xw_IpBDimug";

const MPESA_FUNCTION =
    SUPABASE_URL + "/functions/v1/mpesa";


/* --------------------------------
   DISPLAY CART
-------------------------------- */

function displayCart(){

    const itemsContainer =
        document.getElementById("orderItems");

    const totalElement =
        document.getElementById("orderTotal");

    if(!cart || cart.length === 0){

        itemsContainer.innerHTML =
            "<p>Your cart is empty.</p>";

        totalElement.textContent = "0";

        document.getElementById(
            "remainingBalance"
        ).textContent = "0";

        return;
    }

    itemsContainer.innerHTML = "";

    cart.forEach(item => {

        const row =
            document.createElement("div");

        row.className = "order-item";

        const quantity =
            Number(item.quantity || 1);

        const price =
            Number(item.price || 0);

        const itemTotal =
            price * quantity;

        row.innerHTML = `
            <span>
                ${item.name || item.item || "Product"}
                × ${quantity}
            </span>

            <span>
                KES ${itemTotal.toLocaleString()}
            </span>
        `;

        itemsContainer.appendChild(row);

    });

    const total =
        Number(getCartTotal());

    totalElement.textContent =
        total.toLocaleString();

    updateBalance();
}


/* --------------------------------
   UPDATE BALANCE
-------------------------------- */

function updateBalance(){

    const total =
        Number(getCartTotal());

    const paymentAmount =
        Number(
            document.getElementById(
                "paymentAmount"
            ).value
        );

    let balance =
        total - paymentAmount;

    if(
        !paymentAmount ||
        paymentAmount <= 0
    ){
        balance = total;
    }

    if(balance < 0){
        balance = 0;
    }

    document.getElementById(
        "remainingBalance"
    ).textContent =
        balance.toLocaleString();
}


/* --------------------------------
   PAYMENT AMOUNT LISTENER
-------------------------------- */

document
    .getElementById("paymentAmount")
    .addEventListener(
        "input",
        updateBalance
    );


/* --------------------------------
   SHOW MESSAGE
-------------------------------- */

function showMessage(message,type){

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.className = type;

    box.style.display = "block";
}


/* --------------------------------
   PHONE FORMAT
-------------------------------- */

function formatPhone(phone){

    phone = phone.trim();

    if(phone.startsWith("+254")){
        phone = phone.substring(1);
    }

    if(phone.startsWith("07")){
        phone =
            "254" + phone.substring(1);
    }

    if(phone.startsWith("01")){
        phone =
            "254" + phone.substring(1);
    }

    return phone;
}


/* --------------------------------
   PAY WITH M-PESA
-------------------------------- */

document
    .getElementById("payButton")
    .addEventListener(
        "click",
        async function(){

            const button =
                document.getElementById(
                    "payButton"
                );

            try{

                button.disabled = true;

                showMessage(
                    "Checking your order...",
                    "success"
                );


                /* CUSTOMER DETAILS */

                const customer = {

                    name:
                        document
                        .getElementById(
                            "customerName"
                        )
                        .value
                        .trim(),

                    phone:
                        formatPhone(
                            document
                            .getElementById(
                                "phone"
                            )
                            .value
                        ),

                    email:
                        document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim(),

                    location:
                        document
                        .getElementById(
                            "location"
                        )
                        .value
                        .trim(),

                    address:
                        document
                        .getElementById(
                            "address"
                        )
                        .value
                        .trim()

                };


                /* REQUIRED FIELDS */

                if(
                    !customer.name ||
                    !customer.phone ||
                    !customer.email ||
                    !customer.location ||
                    !customer.address
                ){

                    throw new Error(
                        "Please fill in all customer details."
                    );

                }


                /* PHONE VALIDATION */

                if(
                    !/^254[17]\d{8}$/.test(
                        customer.phone
                    )
                ){

                    throw new Error(
                        "Enter a valid M-Pesa number, e.g. 0712345678."
                    );

                }


                /* CART CHECK */

                if(
                    !cart ||
                    cart.length === 0
                ){

                    throw new Error(
                        "Your cart is empty."
                    );

                }


                /* TOTAL */

                const total =
                    Number(
                        getCartTotal()
                    );


                if(
                    !total ||
                    total <= 0
                ){

                    throw new Error(
                        "Invalid order total."
                    );

                }


                /* AMOUNT TO PAY */

                const paymentAmount =
                    Number(
                        document
                        .getElementById(
                            "paymentAmount"
                        )
                        .value
                    );


                if(
                    !paymentAmount ||
                    paymentAmount <= 0
                ){

                    throw new Error(
                        "Enter the amount you want to pay."
                    );

                }


                if(
                    paymentAmount > total
                ){

                    throw new Error(
                        "Amount to pay cannot be greater than the order total."
                    );

                }


                /* SEND COMPLETE ORDER
                   TO EDGE FUNCTION */

                showMessage(
                    "Sending M-Pesa payment request...",
                    "success"
                );


                const response =
                    await fetch(
                        MPESA_FUNCTION,
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    SUPABASE_KEY
                            },

                            body:
                                JSON.stringify({

                                    customer_name:
                                        customer.name,

                                    phone:
                                        customer.phone,

                                    email:
                                        customer.email,

                                    location:
                                        customer.location,

                                    address:
                                        customer.address,

                                    items:
                                        cart,

                                    total:
                                        total,

                                    amount:
                                        paymentAmount

                                })
                        }
                    );


                /* READ RESPONSE */

                let data;

                try{

                    data =
                        await response.json();

                }catch{

                    throw new Error(
                        "The payment server returned an invalid response."
                    );

                }


                console.log(
                    "M-Pesa response:",
                    data
                );


                /* CHECK RESULT */

                if(
                    !response.ok ||
                    data.success !== true
                ){

                    throw new Error(
                        data.message ||
                        data.errorMessage ||
                        data.ResponseDescription ||
                        "M-Pesa payment request failed."
                    );

                }


                /* SUCCESS */

                showMessage(
                    "M-Pesa request sent successfully. Check your phone and enter your M-Pesa PIN.",
                    "success"
                );


                /*
                   Clear cart only after the
                   Edge Function confirms that
                   the order was created and
                   STK request was accepted.
                */

                localStorage.removeItem(
                    "alNoorCart"
                );


                /*
                   Redirect
                */

                setTimeout(
                    function(){

                        window.location.href =
                            "Homes.html";

                    },
                    3000
                );

            }

            catch(error){

                console.error(
                    "Checkout error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Something went wrong.",
                    "error"
                );

                button.disabled = false;

            }

        }
    );


/* --------------------------------
   LOAD CART
-------------------------------- */

displayCart();

</script>

</body>
</html>
