

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login – Al-Noor Modest Wear</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:90%;
    max-width:400px;
    background:#fff;
    padding:35px;
    border-radius:10px;
    box-shadow:0 2px 12px #0002;
}

h1{
    text-align:center;
    margin-top:0;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:25px;
    padding:13px;
    border:0;
    border-radius:6px;
    background:#111;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

#error{
    color:#b22;
    text-align:center;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="login-box">

<h1>Admin Login</h1>

<form id="loginForm">

<label for="email">Email</label>
<input
    type="email"
    id="email"
    required
>

<label for="password">Password</label>
<input
    type="password"
    id="password"
    required
>

<button type="submit">
    Login
</button>

<p id="error"></p>

</form>

</div>

<script>

const SUPABASE_URL =
    "https://tcoobzomueszhvmtxeta.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_1kqxZHt_moeKQigTvBb1Xw_IpBDimug";


document.getElementById("loginForm").addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const errorElement =
            document.getElementById("error");

        errorElement.textContent = "";

        try{

            const response = await fetch(
                SUPABASE_URL + "/auth/v1/token?grant_type=password",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json",
                        "apikey":SUPABASE_KEY
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );

            const data =
                await response.json();

            if(!response.ok){

                errorElement.textContent =
                    data.error_description ||
                    "Invalid email or password.";

                return;
            }

            localStorage.setItem(
                "adminAccessToken",
                data.access_token
            );

            window.location.href =
                "admin-orders.html";

        }catch(error){

            console.error(error);

            errorElement.textContent =
                "Could not connect to Supabase.";

        }

    }
);

</script>

</body>
</html>
