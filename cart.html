<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart – Al-Noor Modest Wear</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f5ef;color:#222}
header{background:#111;color:#fff;padding:20px;text-align:center}
header h1{margin:0;font-size:28px}
.container{max-width:1000px;margin:40px auto;padding:20px}
.cart-item{display:flex;align-items:center;gap:20px;background:#fff;padding:18px;margin-bottom:15px;border-radius:10px;box-shadow:0 2px 8px #0001}
.cart-item img{width:110px;height:110px;object-fit:cover;border-radius:8px}
.cart-item-info{flex:1}
.cart-item-info h3{margin:0 0 8px}
.cart-options{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.cart-options small{background:#eee;padding:5px 8px;border-radius:5px}
.quantity-controls{display:flex;align-items:center;gap:12px;margin-top:12px}
.quantity-controls button{width:32px;height:32px;border:0;border-radius:5px;background:#111;color:#fff;font-size:18px;cursor:pointer}
.remove-cart-item{margin-top:10px;border:0;background:#b22;color:#fff;padding:7px 12px;border-radius:5px;cursor:pointer}
.cart-summary{background:#fff;padding:25px;border-radius:10px;margin-top:25px;text-align:right}
.cart-summary h2{margin:0 0 15px}
.checkout-btn{display:inline-block;background:#111;color:#fff;text-decoration:none;padding:13px 25px;border-radius:6px;margin-top:10px}
.empty-cart{text-align:center;font-size:20px;padding:60px 20px;background:#fff;border-radius:10px}
.back-btn{display:inline-block;color:#111;text-decoration:none;margin-bottom:20px}
</style>
</head>
<body>

<header>
<h1>Al-Noor Modest Wear</h1>
</header>

<div class="container">
<a href="Men.html" class="back-btn">← Continue Shopping</a>

<h2>Your Cart</h2>

<div id="cartItems"></div>

<div class="cart-summary">
<h2>Total: <span id="cartTotal">KES 0</span></h2>
<a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
</div>
</div>

<script src="cart.js"></script>
</body>
</html>
